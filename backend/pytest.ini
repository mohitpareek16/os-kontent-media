[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# One event loop for the whole run: the engine, its connections and every
# request share it, so an asyncpg connection is never touched from a loop
# other than the one that opened it.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning:passlib.*
markers =
    unit: pure service-layer logic, no HTTP
    integration: full request path through the ASGI app against Postgres
    known_bug: currently FAILING against an open bug in app/ — the assertion
        is what the docs require; deselect with `-m "not known_bug"`
