server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://app:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /sw.js {
        # Never cached. A service worker is the one file a stale copy of which
        # survives a deploy indefinitely — the browser keeps running the old
        # one and the new push format silently stops arriving. Browsers
        # revalidate `/sw.js` on their own schedule, and this makes sure the
        # revalidation actually reaches a fresh file.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
