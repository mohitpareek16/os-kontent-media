# Production Nginx config — TLS termination + reverse proxy.
# Used only via docker-compose.prod.yml (mounted over the image's default.conf).
#
# Four server blocks, and the two `default_server` ones are the point.
#
# This file used to hold two blocks, both named `ops.kontentmedia.in`. Nginx
# makes the *first* block on a port the default for that port, so the plain-HTTP
# redirect was also answering for every other host — including the server's bare
# IP. Opening http://167.71.239.200 therefore 301'd to https://167.71.239.200,
# which the 443 block then served with a certificate issued for
# ops.kontentmedia.in: a name mismatch, a full-page "Not Secure" interstitial,
# and a URL nobody had asked for. Anyone who clicked through was then using the
# app over a connection the browser had already been told not to trust.
#
# So the catch-alls are explicit now, and they send you to the real name rather
# than serving the app under the wrong one.

# --- Anything that isn't the real hostname, over plain HTTP ------------------
# The bare IP lands here. Certbot's challenge is served rather than redirected:
# it is fetched over HTTP by definition, and bouncing it breaks renewal.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ops.kontentmedia.in$request_uri;
    }
}

# --- Anything that isn't the real hostname, over HTTPS -----------------------
# Reached by anyone who clicked through the certificate warning on the IP.
# It has to present *a* certificate to say anything at all, so it presents the
# real one and immediately sends them to the name that certificate is for.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/ops.kontentmedia.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.kontentmedia.in/privkey.pem;

    return 301 https://ops.kontentmedia.in$request_uri;
}

# --- The real host, over plain HTTP ------------------------------------------
server {
    listen 80;
    server_name ops.kontentmedia.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- The real host, over HTTPS: the app --------------------------------------
server {
    listen 443 ssl;
    server_name ops.kontentmedia.in;

    ssl_certificate     /etc/letsencrypt/live/ops.kontentmedia.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.kontentmedia.in/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100M;

    location /api/ {
        proxy_pass http://app:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sw.js {
        # Never cached. A service worker is the one file a stale copy of which
        # survives a deploy indefinitely — the browser keeps running the old
        # one and the new push format silently stops arriving. Browsers
        # revalidate `/sw.js` on their own schedule, and this makes sure the
        # revalidation actually reaches a fresh file.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
