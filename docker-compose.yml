services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kontent
      POSTGRES_PASSWORD: kontent
      POSTGRES_DB: kontent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  app:
    build: ./backend
    env_file: .env
    depends_on:
      - db
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./deploy/certbot-webroot:/var/www/certbot
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
